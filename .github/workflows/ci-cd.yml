name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        [cite_start]run: npm ci # Встановлення бібліотек [cite: 255]

      - name: Run linter
        [cite_start]run: npm run lint # Крок 4: Перевірка стилю коду [cite: 288, 289]

      - name: Run unit tests
        [cite_start]run: npm run test:unit # Крок 5: Запуск модульних тестів [cite: 318, 319]

      - name: Build for production
        [cite_start]run: npm run build # Збірка артефакту для розгортання [cite: 409]

      - name: Upload build artifacts
        [cite_start]uses: actions/upload-artifact@v4 # Збереження папки dist на GitHub [cite: 220]
        with:
          name: dist
          path: dist/